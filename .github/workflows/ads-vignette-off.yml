name: Ads vignette off (manual)

# Owner decision 2026-11-24: the Monetag Vignette (global / interstitial)
# hijacked the whole tab when a scrolling tap landed on it — the owner was
# redirected off the home page to an advertiser page. It is cleared
# everywhere. The row is kept with an empty code (the resolver renders a
# slot only when its code is non-empty), mirrored to KV exactly as the
# admin panel's propagation does, then read back from both stores. The
# Monetag zone itself stays in the owner's Monetag account; refilling the
# slot from the admin panel turns it back on.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply:
    if: vars.SCREENPEEK_SYNC_ENABLED == '1' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
      KV_NAMESPACE_ID: ${{ secrets.KV_NAMESPACE_ID }}
    steps:
      - name: Clear global/interstitial in D1 and its KV mirror
        run: |
          python3 - <<'PYEOF'
          import json, os, urllib.request, urllib.error, urllib.parse

          acct = os.environ['CLOUDFLARE_ACCOUNT_ID']; token = os.environ['CLOUDFLARE_API_TOKEN']
          d1 = f"https://api.cloudflare.com/client/v4/accounts/{acct}/d1/database/{os.environ['D1_DATABASE_ID']}/query"
          kv_base = f"https://api.cloudflare.com/client/v4/accounts/{acct}/storage/kv/namespaces/{os.environ['KV_NAMESPACE_ID']}/values"

          def call(method, url, body=None, content_type='application/json'):
              data = body
              if body is not None and content_type == 'application/json':
                  data = json.dumps(body).encode()
              r = urllib.request.Request(url, data=data, method=method)
              r.add_header('Authorization', 'Bearer ' + token); r.add_header('Content-Type', content_type)
              try:
                  with urllib.request.urlopen(r) as resp: return resp.status, resp.read().decode('utf-8', 'replace')
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode('utf-8', 'replace')[:300]

          def query(sql, params=None):
              status, text = call('POST', d1, {'sql': sql, 'params': params or []})
              if status != 200:
                  raise SystemExit(f'D1 query failed ({status}): {text}')
              return json.loads(text)['result'][0]['results']

          page, placement = 'global', 'interstitial'
          before = query('SELECT code FROM ad_slots WHERE page_type=? AND placement=?', [page, placement])
          before_len = len(before[0]['code']) if before else -1
          print(f'before: {page}/{placement} code {before_len} chars')
          if before_len <= 0:
              raise SystemExit('Slot already empty — nothing to clear.')
          query('UPDATE ad_slots SET code=? WHERE page_type=? AND placement=?', ['', page, placement])
          back = query('SELECT page_type,placement,code,enabled,starts_at,ends_at,test_mode,deleted_at FROM ad_slots WHERE page_type=? AND placement=?', [page, placement])[0]
          kv_key = urllib.parse.quote(f'ad:{page}:{placement}', safe='')
          status, text = call('PUT', f'{kv_base}/{kv_key}', body=json.dumps(back).encode(), content_type='text/plain')
          if status not in (200, 201):
              raise SystemExit(f'KV mirror failed ({status}): {text}')
          status, text = call('GET', f'{kv_base}/{kv_key}')
          mirror = json.loads(text) if status == 200 else {}
          print(f"after: d1 code {len(back['code'])} chars, kv mirror code {len(mirror.get('code', ''))} chars, kv put {status}")
          print('global/interstitial (Monetag Vignette) cleared in D1 + KV')
          PYEOF

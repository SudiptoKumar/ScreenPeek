name: Insight Tier-2 on (manual)

# Manual, owner-requested: sets tracking_t2_enabled=1 in live D1 and
# mirrors it to the config KV key, then reads both back. A go-live
# rebuild afterwards bakes the flag into the static pages.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  enable:
    if: vars.SCREENPEEK_SYNC_ENABLED == '1' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
      KV_NAMESPACE_ID: ${{ secrets.KV_NAMESPACE_ID }}
    steps:
      - name: Set tracking_t2_enabled=1 in D1 and KV mirror
        run: |
          python3 - <<'PYEOF'
          import json, os, urllib.request, urllib.error, urllib.parse
          acct = os.environ['CLOUDFLARE_ACCOUNT_ID']; token = os.environ['CLOUDFLARE_API_TOKEN']
          def call(method, url, body=None, content_type='application/json'):
              data = body
              if body is not None and content_type == 'application/json':
                  data = json.dumps(body).encode()
              r = urllib.request.Request(url, data=data, method=method)
              r.add_header('Authorization', 'Bearer ' + token); r.add_header('Content-Type', content_type)
              try:
                  with urllib.request.urlopen(r) as resp: return resp.status, resp.read().decode('utf-8', 'replace')
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode('utf-8', 'replace')[:300]
          d1 = f"https://api.cloudflare.com/client/v4/accounts/{acct}/d1/database/{os.environ['D1_DATABASE_ID']}/query"
          status, text = call('POST', d1, {'sql': "UPDATE config SET value='1' WHERE key='tracking_t2_enabled'"})
          print('d1 update:', status, text[:200])
          status, text = call('POST', d1, {'sql': "SELECT value FROM config WHERE key='tracking_t2_enabled'"})
          print('d1 readback:', status, text[:200])
          kv_key = urllib.parse.quote('config:tracking_t2_enabled', safe='')
          kv_url = f"https://api.cloudflare.com/client/v4/accounts/{acct}/storage/kv/namespaces/{os.environ['KV_NAMESPACE_ID']}/values/{kv_key}"
          status, text = call('PUT', kv_url, body=b'1', content_type='text/plain')
          print('kv put:', status, text[:200])
          status, text = call('GET', kv_url)
          print('kv readback:', status, text[:100])
          PYEOF

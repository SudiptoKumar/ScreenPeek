name: Webhook tail (one-off diagnostic)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tail:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
      KV_NAMESPACE_ID: ${{ secrets.KV_NAMESPACE_ID }}
      SITE_URL: https://screenpeek.screenpeek.workers.dev
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-fund
      - name: Build (for wrangler config)
        env:
          STATIC_SOURCE_REMOTE: '1'
          DEPLOYMENT_ENV: preview
          SITE_NAME: ScreenPeek
          R2_PUBLIC_BASE: https://pub-9d4cb9fd4fe44dc59a8b1524db1410c8.r2.dev
          ADS_ENABLED: '1'
        run: npm run build
      - name: Patch preview Worker config
        env:
          R2_PUBLIC_BASE: https://pub-9d4cb9fd4fe44dc59a8b1524db1410c8.r2.dev
        run: |
          node - <<'NODEEOF'
          const fs = require('node:fs');
          const path = 'dist/server/wrangler.json';
          const cfg = JSON.parse(fs.readFileSync(path, 'utf8'));
          cfg.account_id = process.env.CLOUDFLARE_ACCOUNT_ID;
          const db = cfg.d1_databases.find(b => b.binding === 'DB');
          db.database_id = process.env.D1_DATABASE_ID;
          const kv = cfg.kv_namespaces.find(b => b.binding === 'CONFIG');
          kv.id = process.env.KV_NAMESPACE_ID; delete kv.preview_id;
          cfg.r2_buckets.find(b => b.binding === 'POSTERS').bucket_name = 'posters';
          cfg.r2_buckets.find(b => b.binding === 'BACKUPS').bucket_name = 'screenpeek-backups';
          fs.writeFileSync(path, JSON.stringify(cfg, null, 2));
          console.log('config ready:', cfg.name);
          NODEEOF
      - name: Webhook info before tail
        env:
          BOT_TOKEN: ${{ secrets.MONEY_BOT_TOKEN }}
        run: |
          curl -s "https://api.telegram.org/bot${BOT_TOKEN}/getWebhookInfo"; echo
      - name: Tail worker logs (tap Refresh now)
        run: |
          timeout 170 node scripts/tool.mjs wrangler tail --config dist/server/wrangler.json --format pretty || true
      - name: Webhook info after tail
        env:
          BOT_TOKEN: ${{ secrets.MONEY_BOT_TOKEN }}
        run: |
          curl -s "https://api.telegram.org/bot${BOT_TOKEN}/getWebhookInfo"; echo

name: Access end-to-end probe

# Manual: creates a TEMPORARY Access service token + allow policy, calls
# /admin with it (a textbook authenticated Access request), reports whether
# the panel accepts it, then deletes both. The token secret never leaves
# the runner and is never printed.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    if: vars.SCREENPEEK_SYNC_ENABLED == '1' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Probe /admin with a temporary service token
        run: |
          python3 - <<'PYEOF'
          import json, os, urllib.request, urllib.error
          acct = os.environ['CLOUDFLARE_ACCOUNT_ID']; token = os.environ['CLOUDFLARE_API_TOKEN']
          APP = '05f85016-2847-4c8f-8d5e-6e0c7f8b7054'
          def call(method, path, body=None):
              data = json.dumps(body).encode() if body is not None else None
              r = urllib.request.Request('https://api.cloudflare.com/client/v4' + path, data=data, method=method)
              r.add_header('Authorization', 'Bearer ' + token); r.add_header('Content-Type', 'application/json')
              try:
                  with urllib.request.urlopen(r) as resp: return json.load(resp)
              except urllib.error.HTTPError as e:
                  return {'success': False, 'errors': [{'message': f'HTTP {e.code}: ' + e.read().decode("utf-8", "replace")[:300]}]}
          made = call('POST', f'/accounts/{acct}/access/service_tokens', {'name': 'screenpeek-diagnose-temp'})
          if not made.get('success'):
              print('service token create FAILED:', json.dumps(made.get('errors'))[:300]); raise SystemExit(0)
          st = made['result']; st_id = st['id']
          print('service token created:', st_id)
          pol = call('POST', f'/accounts/{acct}/access/apps/{APP}/policies',
                     {'name': 'Diagnose temp', 'decision': 'allow', 'precedence': 1,
                      'include': [{'service_token': {'token_id': st_id}}]})
          print('policy create:', pol.get('success'), json.dumps(pol.get('errors'))[:200] if not pol.get('success') else '')
          pol_id = (pol.get('result') or {}).get('id')
          try:
              if pol.get('success'):
                  import time; time.sleep(5)
                  req = urllib.request.Request('https://screenpeek.screenpeek.workers.dev/admin', method='GET')
                  req.add_header('CF-Access-Client-Id', st['client_id'])
                  req.add_header('CF-Access-Client-Secret', st['client_secret'])
                  try:
                      with urllib.request.urlopen(req, timeout=30) as resp:
                          body = resp.read().decode('utf-8', 'replace'); status = resp.status
                  except urllib.error.HTTPError as e:
                      body = e.read().decode('utf-8', 'replace'); status = e.code
                  print('probe status:', status)
                  print('probe sees 401 notice:', 'Sign in through Cloudflare Access to continue' in body)
                  print('probe sees no-admin-role msg:', 'no admin role' in body)
                  import re
                  h = re.search(r'<h1[^>]*>(.*?)</h1>', body, re.S)
                  print('probe h1:', (h.group(1).strip()[:80] if h else 'none'))
                  print('probe body sample:', body[:200].replace('\n', ' '))
          finally:
              if pol_id: print('policy delete:', call('DELETE', f'/accounts/{acct}/access/apps/{APP}/policies/{pol_id}').get('success'))
              print('token delete:', call('DELETE', f'/accounts/{acct}/access/service_tokens/{st_id}').get('success'))
          PYEOF

name: velvet-deploy
# One-off bootstrap: deploys the VELVET project (SudiptoKumar/VELVET) using this
# repo's Cloudflare secrets, so VELVET needs no setup step of its own yet.
# VELVET's own repo carries the same deploy for later, once its secrets are added.
on:
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: SudiptoKumar/VELVET
          path: velvet
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deploy VELVET
        run: bash velvet/scripts/deploy.sh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

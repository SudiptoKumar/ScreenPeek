name: Monetag seed (manual, one-time)

# One-time production setting: install the two Monetag tags Karn created
# (In-Page Push zone 12236746 and Vignette zone 12236759) into the global
# ad slots. The MultiTag code is deliberately NOT installed: it forces a
# second popunder (competing with Adsterra's) and duplicates these two
# formats. Manual dispatch only; delete this file after it has run.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: screenpeek-monetag-seed
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-fund
      - name: Install Monetag tags into global ad slots
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          KV_NAMESPACE_ID: ${{ secrets.KV_NAMESPACE_ID }}
        run: |
          sed -i "s/00000000-0000-0000-0000-000000000001/${D1_DATABASE_ID}/" wrangler.toml
          sed -i "s/00000000000000000000000000000001/${KV_NAMESPACE_ID}/" wrangler.toml
          cat > /tmp/monetag.sql <<'SQL'
          INSERT INTO ad_slots(page_type,placement,code,enabled) VALUES('global','inpage_push','<script>(function(s){s.dataset.zone=''12236746'',s.src=''https://nap5k.com/tag.min.js''})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement(''script'')))</script>',1) ON CONFLICT(page_type,placement) DO UPDATE SET code=excluded.code, enabled=1;
          INSERT INTO ad_slots(page_type,placement,code,enabled) VALUES('global','interstitial','<script>(function(s){s.dataset.zone=''12236759'',s.src=''https://n6wxm.com/vignette.min.js''})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement(''script'')))</script>',1) ON CONFLICT(page_type,placement) DO UPDATE SET code=excluded.code, enabled=1;
          SQL
          node scripts/tool.mjs wrangler d1 execute DB --remote --file=/tmp/monetag.sql
          node scripts/tool.mjs wrangler d1 execute DB --remote --command "SELECT page_type,placement,enabled,length(code) AS code_len FROM ad_slots WHERE page_type='global' AND placement IN ('inpage_push','interstitial')"
          # The public resolver reads the KV mirror first (key ad:<page>:<placement>);
          # an empty tombstone mirror would shadow the D1 rows, so mirror them too,
          # in the same record shape the admin propagation writes.
          cat > /tmp/ipp.json <<'JSON'
          {"page_type":"global","placement":"inpage_push","code":"<script>(function(s){s.dataset.zone='12236746',s.src='https://nap5k.com/tag.min.js'})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')))</script>","enabled":1,"starts_at":null,"ends_at":null,"test_mode":0,"deleted_at":null}
          JSON
          cat > /tmp/vig.json <<'JSON'
          {"page_type":"global","placement":"interstitial","code":"<script>(function(s){s.dataset.zone='12236759',s.src='https://n6wxm.com/vignette.min.js'})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')))</script>","enabled":1,"starts_at":null,"ends_at":null,"test_mode":0,"deleted_at":null}
          JSON
          node scripts/tool.mjs wrangler kv key put "ad:global:inpage_push" --path=/tmp/ipp.json --namespace-id=${KV_NAMESPACE_ID}
          node scripts/tool.mjs wrangler kv key put "ad:global:interstitial" --path=/tmp/vig.json --namespace-id=${KV_NAMESPACE_ID}

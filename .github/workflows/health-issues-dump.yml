name: Health issues dump (manual, read-only)

# Prints every issue the admin panel's health report currently shows,
# using the same queries as src/lib/admin/health.ts, so the list can be
# worked through one by one. Read-only: SELECTs only.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dump:
    if: vars.SCREENPEEK_SYNC_ENABLED == '1' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
    steps:
      - name: Dump current health issues
        run: |
          python3 - <<'PYEOF'
          import json, os, urllib.request, urllib.error

          acct = os.environ['CLOUDFLARE_ACCOUNT_ID']; token = os.environ['CLOUDFLARE_API_TOKEN']
          url = f"https://api.cloudflare.com/client/v4/accounts/{acct}/d1/database/{os.environ['D1_DATABASE_ID']}/query"

          def query(sql):
              body = json.dumps({'sql': sql}).encode()
              r = urllib.request.Request(url, data=body, method='POST')
              r.add_header('Authorization', 'Bearer ' + token); r.add_header('Content-Type', 'application/json')
              try:
                  with urllib.request.urlopen(r) as resp: data = json.loads(resp.read().decode())
              except urllib.error.HTTPError as e:
                  raise SystemExit(f'D1 query failed HTTP {e.code}: ' + e.read().decode('utf-8', 'replace')[:200])
              if not data.get('success'):
                  raise SystemExit('D1 query error: ' + json.dumps(data.get('errors'))[:300])
              return data['result'][0]['results']

          issues = []

          latest = query('SELECT id,status FROM sync_log ORDER BY id DESC LIMIT 1')
          if not latest or latest[0]['status'] == 'failed':
              issues.append(('sync', 'Latest sync is ' + (latest[0]['status'] if latest else 'missing')))

          rows = query("SELECT id,type,title,poster_r2,overview FROM titles WHERE hidden=0 AND deleted=0 AND deleted_at IS NULL AND (poster_r2 IS NULL OR trim(poster_r2)='' OR overview IS NULL OR trim(overview)='') ORDER BY id LIMIT 1000")
          for row in rows:
              if not (row['poster_r2'] or '').strip():
                  issues.append((f"poster:{row['type']}:{row['id']}", f"Missing poster: {row['title']}"))
              ov = (row['overview'] or '').strip()
              if len(ov) == 0:
                  issues.append((f"overview:{row['type']}:{row['id']}", f"Missing overview: {row['title']}"))

          admap = {
              'home': ['top_300x250', 'native', 'infeed', 'lower_300x250', 'sticky_320x50'],
              'list': ['top_300x250', 'native', 'infeed', 'sticky_320x50'],
              'detail': ['top_300x250', 'native', 'infeed', 'lower_300x250', 'sticky_320x50', 'popunder'],
              'cast': ['top_300x250', 'native', 'sticky_320x50'],
              'watch': ['top_300x250', 'native', 'infeed', 'sticky_320x50'],
              'trailer': ['top_300x250', 'sticky_320x50'],
              'search': ['native', 'sticky_320x50'],
              'global': ['social_bar'],
          }
          slots = query('SELECT page_type,placement,code FROM ad_slots WHERE deleted_at IS NULL')
          by_slot = {(s['page_type'], s['placement']): (s['code'] or '') for s in slots}
          for page, placements in admap.items():
              for placement in placements:
                  if not by_slot.get((page, placement), '').strip():
                      issues.append((f'empty:{page}:{placement}', f'Empty ad slot: {page}/{placement}'))
          for row in query('SELECT path,count FROM notfound_log WHERE count>=5 ORDER BY count DESC LIMIT 100'):
              issues.append((f"404:{row['path']}", f"Visited 404: {row['path']} (~ {row['count']})"))

          wd = query("SELECT value FROM config WHERE key='sync_write_day'")
          print('SYNC_WRITE_DAY:', wd[0]['value'] if wd else 'unset')
          print(f'TOTAL ISSUES: {len(issues)}')
          for i, (key, msg) in enumerate(issues, 1):
              print(f'{i:3d}. [{key}] {msg}')
          PYEOF

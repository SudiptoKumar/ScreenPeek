name: Money stats and alerts
# Pulls Adsterra stats into D1 every 30 minutes and sends Telegram money
# alerts (first earning, milestones, expected payouts, daily summary) via
# scripts/money_check.py. Idempotent: alert state lives in D1 config.
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
concurrency:
  group: screenpeek-money-main
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  check:
    if: vars.SCREENPEEK_SYNC_ENABLED == '1' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ADSTERRA_API_TOKEN: ${{ secrets.ADSTERRA_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
      KV_NAMESPACE_ID: ${{ secrets.KV_NAMESPACE_ID }}
      MONEY_BOT_TOKEN: ${{ secrets.MONEY_BOT_TOKEN }}
      MONEY_BOT_CHAT_ID: ${{ secrets.MONEY_BOT_CHAT_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Pull Adsterra stats, store, and alert
        shell: bash
        run: |
          set +e
          python3 scripts/money_check.py 2>&1 | tee /tmp/money-check.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ] && grep -qE "free tier daily row (write|read) limit" /tmp/money-check.log; then
            echo "D1 daily row limit reached — this check rests until the limit resets at 00:00 UTC. Not a failure; alert state is stored in D1 and the next check after the reset catches up."
            exit 0
          fi
          exit "$code"

name: Money stats and alerts
# Pulls Adsterra stats into D1 every 30 minutes and sends Telegram money
# alerts (first earning, milestones, expected payouts, daily summary) via
# scripts/money_check.py. Idempotent: alert state lives in D1 config.
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
concurrency:
  group: screenpeek-money-main
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  check:
    if: vars.SCREENPEEK_SYNC_ENABLED == '1' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ADSTERRA_API_TOKEN: ${{ secrets.ADSTERRA_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
      MONEY_BOT_TOKEN: ${{ secrets.MONEY_BOT_TOKEN }}
      MONEY_BOT_CHAT_ID: ${{ secrets.MONEY_BOT_CHAT_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Pull Adsterra stats, store, and alert
        run: python3 scripts/money_check.py

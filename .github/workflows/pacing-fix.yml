name: Pacing fix (manual, one-time)

# One-time production setting: shape each sync run at 63 movies + 13
# series (x 8 runs a day = the owner's 500 movies + 100 series a day).
# Manual dispatch only; delete this file after it has run.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: screenpeek-pacing-fix
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-fund
      - name: Set per-run pacing caps in remote D1
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          KV_NAMESPACE_ID: ${{ secrets.KV_NAMESPACE_ID }}
        run: |
          sed -i "s/00000000-0000-0000-0000-000000000001/${D1_DATABASE_ID}/" wrangler.toml
          sed -i "s/00000000000000000000000000000001/${KV_NAMESPACE_ID}/" wrangler.toml
          node scripts/tool.mjs wrangler d1 execute DB --remote --command "INSERT INTO config(key,value) VALUES('sync_movie_cap','63') ON CONFLICT(key) DO UPDATE SET value=excluded.value, revision=revision+1"
          node scripts/tool.mjs wrangler d1 execute DB --remote --command "INSERT INTO config(key,value) VALUES('sync_series_cap','13') ON CONFLICT(key) DO UPDATE SET value=excluded.value, revision=revision+1"
          node scripts/tool.mjs wrangler d1 execute DB --remote --command "SELECT key,value FROM config WHERE key IN ('sync_movie_cap','sync_series_cap')"

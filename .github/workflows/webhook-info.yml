name: Webhook info (one-off)
on:
  workflow_dispatch:
jobs:
  info:
    runs-on: ubuntu-latest
    steps:
      - name: Telegram getWebhookInfo
        env:
          BOT_TOKEN: ${{ secrets.MONEY_BOT_TOKEN }}
        run: |
          curl -s "https://api.telegram.org/bot${BOT_TOKEN}/getWebhookInfo"
          echo

name: Access debug tail

# Manual: streams live Worker logs for a few minutes so one admin sign-in
# attempt records its exact [access-debug] refusal reason.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tail:
    if: vars.SCREENPEEK_SYNC_ENABLED == '1' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-fund
      - name: Tail worker logs for 4 minutes
        run: |
          echo "TAIL WINDOW OPEN"
          (timeout 240 node scripts/tool.mjs wrangler tail screenpeek --format pretty > tail.log 2>&1) || true
          echo "=== access-debug lines ==="
          grep -a "access-debug" tail.log | tail -20 || echo "none captured"
          echo "=== sample of all log lines ==="
          tail -30 tail.log

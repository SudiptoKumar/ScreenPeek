name: Telegram API probe (one-off)
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe answerWidgetQuery and editMessageWidgetData shapes
        env:
          BOT_TOKEN: ${{ secrets.MONEY_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.MONEY_BOT_CHAT_ID }}
        run: |
          echo "--- answerWidgetQuery with only an id"
          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/answerWidgetQuery" -H "Content-Type: application/json" -d '{"widget_query_id":"12345"}'; echo
          echo "--- answerWidgetQuery with id + result ok"
          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/answerWidgetQuery" -H "Content-Type: application/json" -d '{"widget_query_id":"12345","result":{"type":"ok"}}'; echo
          echo "--- editMessageWidgetData with fake message id in the real chat"
          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/editMessageWidgetData" -H "Content-Type: application/json" -d "{\"chat_id\":${CHAT_ID},\"message_id\":999999,\"chat_data\":\"{}\"}"; echo

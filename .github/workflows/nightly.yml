name: Daily sync

on:
  schedule:
    # Four times a day while the deferred backlog drains; revisit once
    # the queue is empty (a single daily run then suffices).
    - cron: '30 2,5,8,11,14,17,20,23 * * *'
    - cron: '15 0,3,6,9,12,15,18,21 * * *'
  workflow_dispatch:
    inputs:
      ids:
        description: 'Optional targeted import: movie:123,tv:456,person:789'
        type: string
        required: false
        default: ''
      deploy:
        description: Deploy after a successful sync and build (requires deployment enabled)
        type: boolean
        required: false
        default: false
      gate_test:
        description: 'Test only: run the daily write-budget gate as if this were a scheduled run'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: screenpeek-nightly-main
  cancel-in-progress: false

jobs:
  sync:
    # The owner requested local development first. Missing variables leave all
    # remote writes disabled, including scheduled runs and manual dispatches.
    if: vars.SCREENPEEK_SYNC_ENABLED == '1' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Backstop only. The sync engine self-limits (12 min scheduled, 25 min
    # targeted) and defers unfinished work, so a job should never be killed
    # mid-title before its summary and deferrals are saved. 30 min proved
    # too tight for cold-start imports of large series; 120 removes the
    # failure mode without changing how long runs actually take.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-fund
      - name: Daily write-budget gate
        id: gate
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          GATE_EVENT: ${{ github.event_name }}
          GATE_TEST: ${{ inputs.gate_test }}
        run: |
          python3 - <<'PYEOF2'
          import json, os, urllib.request, urllib.error
          from datetime import datetime, timezone

          def out(go, why):
              print(why)
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write('go=' + ('true' if go else 'false') + '\n')
              raise SystemExit(0)

          # Manual runs are the owner's explicit instruction: never gated,
          # unless the gate_test input asks to exercise the gate itself.
          if os.environ.get('GATE_EVENT') != 'schedule' and os.environ.get('GATE_TEST') != 'true':
              out(True, 'Gate: manual run — always proceeds.')

          acct = os.environ['CLOUDFLARE_ACCOUNT_ID']; token = os.environ['CLOUDFLARE_API_TOKEN']
          url = f"https://api.cloudflare.com/client/v4/accounts/{acct}/d1/database/{os.environ['D1_DATABASE_ID']}/query"

          def query(sql, params=None):
              body = json.dumps({'sql': sql, 'params': params or []}).encode()
              r = urllib.request.Request(url, data=body, method='POST')
              r.add_header('Authorization', 'Bearer ' + token); r.add_header('Content-Type', 'application/json')
              try:
                  with urllib.request.urlopen(r) as resp: return json.loads(resp.read().decode())
              except urllib.error.HTTPError as e:
                  try: return json.loads(e.read().decode())
                  except Exception: return {'success': False, 'errors': [{'code': -1, 'message': f'HTTP {e.code}'}]}

          today = datetime.now(timezone.utc).date().isoformat()
          rows = 0
          res = query("SELECT value FROM config WHERE key='sync_write_day'")
          try:
              saved = json.loads(res['result'][0]['results'][0]['value'])
              if saved.get('day') == today: rows = int(saved.get('rows') or 0)
          except Exception:
              rows = 0
          print(f'Gate: sync has written {rows} rows today (UTC {today}); daily sync budget is 95,000 of the 100,000 account limit.')
          if rows >= 95000:
              out(False, 'Gate: daily write budget spent — this run rests. No writes attempted, nothing failed; sync resumes after the 00:00 UTC reset.')

          probe = query("INSERT INTO config(key,value,revision) VALUES('quota_probe',?,1) ON CONFLICT(key) DO UPDATE SET value=excluded.value, revision=revision+1",
                        [datetime.now(timezone.utc).isoformat()])
          errs = probe.get('errors') or []
          if not probe.get('success'):
              text = json.dumps(errs)
              if '7500' in text or 'free tier daily row write limit' in text:
                  out(False, 'Gate: the account write limit is already reached (other writers used the headroom) — this run rests until the 00:00 UTC reset.')
              print(f'Gate: probe write returned an unexpected error ({text[:200]}) — proceeding; the sync will surface any real problem.')
          out(True, 'Gate: budget remains — sync proceeds.')
          PYEOF2
      - name: Sync catalogue and images
        if: steps.gate.outputs.go == 'true'
        shell: bash
        env:
          SYNC_IDS: ${{ inputs.ids }}
          SYNC_MAX_DURATION_MS: ${{ vars.SYNC_MAX_DURATION_MS }}
          TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TMDB_BASE_URL: ${{ vars.TMDB_BASE_URL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET || 'posters' }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          OWNER_CHAT_ID: ${{ secrets.OWNER_CHAT_ID }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          args=(--remote)
          if [[ -n "$SYNC_IDS" ]]; then
            args+=(--ids "$SYNC_IDS")
          fi
          # The CLI validates type-prefixed IDs; input is never evaluated as shell.
          npm run sync:run -- "${args[@]}"
      - name: Insight nightly jobs (auto-optimiser, retention, postbacks, health, alerts, report)
        if: ${{ vars.SCREENPEEK_SYNC_ENABLED == '1' && steps.gate.outputs.go == 'true' }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          KV_NAMESPACE_ID: ${{ secrets.KV_NAMESPACE_ID }}
          MONEY_BOT_TOKEN: ${{ secrets.MONEY_BOT_TOKEN }}
          MONEY_BOT_CHAT_ID: ${{ secrets.MONEY_BOT_CHAT_ID }}
        run: |
          node scripts/tool.mjs node scripts/insight_jobs.ts autoopt
          node scripts/tool.mjs node scripts/insight_jobs.ts retention
          node scripts/tool.mjs node scripts/insight_jobs.ts postbacks-retry
          node scripts/tool.mjs node scripts/insight_jobs.ts link-health
          node scripts/tool.mjs node scripts/insight_jobs.ts alerts
          node scripts/tool.mjs node scripts/insight_jobs.ts weekly-report
      - name: Build static hubs and top titles with long-tail Worker
        if: steps.gate.outputs.go == 'true'
        env:
          STATIC_SOURCE_REMOTE: '1'
          DEPLOYMENT_ENV: production
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          SITE_NAME: ${{ vars.SITE_NAME || 'ScreenPeek' }}
          R2_PUBLIC_BASE: ${{ vars.R2_PUBLIC_BASE }}
          ADS_ENABLED: ${{ vars.ADS_ENABLED || '0' }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: npm run build
      - name: Deploy approved build and purge stale SSR cache
        if: vars.SCREENPEEK_DEPLOY_ENABLED == '1' && steps.gate.outputs.go == 'true' && (github.event_name == 'schedule' || inputs.deploy == true)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          R2_BACKUP_BUCKET: ${{ vars.R2_BACKUP_BUCKET }}
          BACKUP_BUCKET_PRIVATE: ${{ vars.BACKUP_BUCKET_PRIVATE }}
          KV_NAMESPACE_ID: ${{ secrets.KV_NAMESPACE_ID }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          SITE_URL: ${{ vars.SITE_URL }}
          SITE_NAME: ${{ vars.SITE_NAME || 'ScreenPeek' }}
          R2_BUCKET: ${{ vars.R2_BUCKET || 'posters' }}
          R2_PUBLIC_BASE: ${{ vars.R2_PUBLIC_BASE }}
          ADS_ENABLED: ${{ vars.ADS_ENABLED || '0' }}
          GITHUB_REPO: ${{ github.repository }}
          SCREENPEEK_DEPLOY_ENABLED: ${{ vars.SCREENPEEK_DEPLOY_ENABLED }}
        run: npm run deploy

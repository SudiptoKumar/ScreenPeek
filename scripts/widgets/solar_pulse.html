<style>
*{box-sizing:border-box}body{margin:0;padding:12px;color:var(--tg-theme-text-color);font:14px/1.35 system-ui,sans-serif;color-scheme:light dark}.shell{display:flex;flex-direction:column;gap:9px}
.header{display:flex;justify-content:space-between;align-items:center}.brand{font-size:12px;font-weight:900;letter-spacing:1.8px}.tag{font-size:9px;padding:5px 8px;border-radius:20px;background:var(--tg-theme-secondary-bg-color);color:var(--tg-theme-hint-color)}
.hero{padding:15px;border-radius:18px;color:#fff;background:linear-gradient(125deg,#8a3bd1 0%,#c44c9a 42%,#f0784c 100%);position:relative;overflow:hidden;animation:pop .55s ease both}.hero:before{content:"";position:absolute;width:170px;height:170px;border-radius:50%;right:-60px;top:-95px;background:#ffffff20}.label{font-size:10px;letter-spacing:1.5px;color:#ffe5ed}.amount{font-size:34px;font-weight:850;letter-spacing:-1px;margin:5px 0}.foot{display:flex;justify-content:space-between;font-size:10px;color:#ffe5e9}.bars{height:34px;display:flex;align-items:end;gap:6px;margin-top:11px}.bars i{flex:1;min-width:7px;border-radius:5px 5px 1px 1px;background:#fff;height:8%;transition:height .6s ease;box-shadow:0 0 9px #fff5}
.strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}.metric{padding:9px 6px;text-align:center;border-radius:11px;background:var(--tg-theme-secondary-bg-color);border:1px solid var(--tg-theme-section-separator-color)}.metric small{display:block;color:var(--tg-theme-hint-color);font-size:9px;letter-spacing:.5px}.metric b{display:block;font-size:15px;margin-top:4px;font-variant-numeric:tabular-nums}
.box{padding:12px;border-radius:14px;background:var(--tg-theme-secondary-bg-color);border:1px solid var(--tg-theme-section-separator-color)}.boxhead{display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:800;letter-spacing:.7px}.muted{font-size:10px;color:var(--tg-theme-hint-color)}.meter{height:8px;background:var(--tg-theme-section-separator-color);border-radius:9px;overflow:hidden;margin:8px 0}.fill{height:100%;width:0;background:linear-gradient(90deg,#9a55e8,#ff805a);border-radius:9px;transition:width .7s ease}.footrow{display:flex;justify-content:space-between;align-items:center;font-size:10px;color:var(--tg-theme-hint-color)}
.controls{display:flex;align-items:center;justify-content:space-between}.btn{border:0;border-radius:10px;padding:9px 13px;color:white;background:linear-gradient(100deg,#914bd7,#e66c69);font-weight:800;font-size:12px}.status{font-size:9px;color:var(--tg-theme-hint-color)}
@keyframes pop{from{opacity:0;transform:scale(.985) translateY(7px)}to{opacity:1;transform:scale(1) translateY(0)}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
<div class="shell">
  <div class="header"><div><div class="brand">SCREENPEEK</div><div class="muted">REVENUE PULSE</div></div><div class="tag">● TODAY</div></div>
  <section class="hero">
    <div class="label">TOTAL REVENUE TODAY</div><div class="amount" id="rev">$0.00</div>
    <div class="foot"><span id="updated">Waiting for first sync</span><span>7-DAY TREND</span></div>
    <div class="bars"><i data-bar></i><i data-bar></i><i data-bar></i><i data-bar></i><i data-bar></i><i data-bar></i><i data-bar></i></div>
  </section>
  <div class="strip">
    <div class="metric"><small>VIEWS</small><b id="imp">0</b></div>
    <div class="metric"><small>CLICKS</small><b id="clk">0</b></div>
    <div class="metric"><small>CTR</small><b id="ctr">0%</b></div>
    <div class="metric"><small>CPM</small><b id="cpm">$0</b></div>
  </div>
  <section class="box">
    <div class="boxhead"><span>THIS MONTH</span><span id="monthRev">$0.00</span></div>
    <div class="footrow" style="margin-top:7px"><span>Impressions</span><b id="monthImp">0</b></div>
  </section>
  <section class="box">
    <div class="boxhead"><span>PAYOUT GOAL</span><span id="payPct">0%</span></div>
    <div class="meter"><div class="fill" id="payFill"></div></div>
    <div class="footrow"><span id="payLabel">$0.00 / $100.00</span><span>ALL-TIME <b id="earned">$0.00</b></span></div>
    <div class="footrow" style="margin-top:9px"><span>Next milestone <b id="mile">$10.00</b></span><b id="milePct">0%</b></div>
    <div class="meter"><div class="fill" id="mileFill"></div></div>
    <div class="footrow"><span>Current balance</span><b id="balance">$0.00</b></div>
  </section>
  <div class="controls"><button class="btn" id="refresh">↻ Refresh now</button><span class="status" id="status">DATA SYNCED</span></div>
</div>
<script>
(function(){
  const W = window.TelegramWidget;
  const $ = id => document.getElementById(id);
  const defaults = {
    revenue:0, impressions:0, clicks:0, ctr:0, cpm:0,
    month_revenue:0, month_impressions:0, earned:0, balance:0,
    milestone:10, payout_target:100, trend:[0,0,0,0,0,0,0],
    updated:"Waiting for first sync"
  };
  const money = n => "$" + Number(n || 0).toFixed(2);
  const integer = n => String(Math.round(Number(n || 0))).replace(/\B(?=(\d{3})+(?!\d))/g,",");
  function readData(){
    try { return Object.assign({}, defaults, JSON.parse(W.chatData || "{}")); }
    catch(e) { return Object.assign({}, defaults); }
  }
  function put(id, value){
    const el = $(id);
    if(el) el.textContent = value;
  }
  function render(){
    const d = readData();
    const clicks = Number(d.clicks || 0);
    const impressions = Number(d.impressions || 0);
    const ctr = d.ctr == null ? (impressions ? clicks / impressions * 100 : 0) : Number(d.ctr);
    const target = Math.max(0.01, Number(d.payout_target || 100));
    const milestone = Math.max(0.01, Number(d.milestone || 10));
    const balance = Math.max(0, Number(d.balance || 0));
    const payout = Math.min(100, balance / target * 100);
    const milestoneProgress = Math.min(100, balance / milestone * 100);

    put("rev", money(d.revenue));
    put("imp", integer(impressions));
    put("clk", integer(clicks));
    put("ctr", ctr.toFixed(2) + "%");
    put("cpm", money(d.cpm));
    put("monthRev", money(d.month_revenue));
    put("monthImp", integer(d.month_impressions));
    put("earned", money(d.earned));
    put("balance", money(balance));
    put("mile", money(milestone));
    put("milePct", milestoneProgress.toFixed(0) + "%");
    if($("payFill")) $("payFill").style.width = payout + "%";
    if($("mileFill")) $("mileFill").style.width = milestoneProgress + "%";
    put("payPct", payout.toFixed(1) + "%");
    put("payLabel", money(balance) + " / " + money(target));
    put("updated", String(d.updated || "Waiting for first sync"));
    const bars = document.querySelectorAll("[data-bar]");
    const values = Array.isArray(d.trend) ? d.trend.slice(-7) : [];
    const max = Math.max(0.0001, ...values.map(Number));
    bars.forEach((bar, i) => {
      const value = Number(values[i] || 0);
      bar.style.height = Math.max(5, value / max * 100) + "%";
    });
    put("status", d.error ? "DATA ERROR" : "DATA SYNCED");
  }

  let busy = false;
  const refresh = $("refresh");
  if(refresh){
    refresh.addEventListener("click", function(){
      if(busy) return;
      busy = true;
      refresh.disabled = true;
      put("status", "REFRESHING...");
      W.request("refresh").then(function(answer){
        put("status", answer && answer.result === "error" ? "REFRESH FAILED" : "REFRESH COMPLETE");
      }).catch(function(error){
        put("status", error && error.code === "RATE_LIMITED" ? "WAIT A MOMENT" : "REFRESH FAILED");
      }).finally(function(){
        busy = false;
        refresh.disabled = false;
      });
    });
  }
  W.onEvent("chatDataChanged", render);
  render();
  if(W.ready) W.ready();
})();
</script>
